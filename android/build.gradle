// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Force Java 17 source/target for every module so the build works with the locally installed JDK 17
// (source level 17 also compiles fine under JDK 21). This override runs after Evaluate, so it wins
// over the VERSION_21 values that `capacitor update` regenerates into the per-module build files.
subprojects {
    afterEvaluate { p ->
        def androidExt = p.extensions.findByName('android')
        if (androidExt) {
            androidExt.compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
